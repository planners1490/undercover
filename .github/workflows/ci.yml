name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration test suite
        run: python3 -m unittest discover -s tests -v
      - name: Run self-audit (verify Grade A)
        run: |
          python3 skills/undercover/scripts/undercover.py audit . --skip-configs --fail-on HIGH --output /tmp/ci_audit.json
          python3 -c "import json; d=json.load(open('/tmp/ci_audit.json')); assert d['stealth_grade'] == 'A', d"
